name: GGB
options:
  bundleIdPrefix: com.gcomic
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "5.0"
  DEVELOPMENT_TEAM: ""

packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 7.12.0
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0

targets:
  GGB:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        type: folder
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.gcomic.ggb
      INFOPLIST_FILE: Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: Kingfisher
      - package: SwiftSoup